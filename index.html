<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(/github\.io$/.test(location.hostname)){location.replace("https://maisonsaintsauveur.fr"+location.pathname.replace(/^\/Forma-Mantis/i,"")+location.search+location.hash);}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEEAE2">
<title>Maison Saint Sauveur</title>
<link rel="icon" href="registre/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#EEEAE2;color:#1C1B19;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;max-width:1440px;margin:0 auto;padding:56px 100px 48px;display:flex;flex-direction:column}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.7}
.r{border-top:1px solid #1C1B19;padding-top:10px}
.mut{color:#6B675F}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:80px 0}
h1{font-family:"Cormorant Garamond","Iowan Old Style",Georgia,serif;font-weight:600;font-size:clamp(56px,9vw,128px);line-height:.98;letter-spacing:.005em}
a{color:#1C1B19;text-decoration:none;border-bottom:1px solid #CFC8BB}
a:hover{border-color:#1C1B19}
@media (max-width:760px){.wrap{padding:28px 20px 32px}.g3{grid-template-columns:1fr;gap:16px}.hx{display:none}main{padding:56px 0}}
</style>
</head>
<body>
<div class="wrap">
<header class="g3">
<div class="cap">Maison Saint Sauveur</div>
<div class="cap r hx"><div>Paris · Bretagne</div><div>2026</div></div>
<div class="cap r"><div>Ouverture prochaine</div><div>Sur rendez-vous</div></div>
</header>
<main>
<div class="cap mut">Art contemporain · Mode · Éditions</div>
<h1>Maison<br>Saint Sauveur</h1>
<div class="cap mut">Paris · Bretagne</div>
</main>
<footer class="g3">
<div class="r"><div class="cap">Notes</div><p style="margin-top:6px">Site en préparation.</p></div>
<div class="r"><div class="cap">Maison</div><p style="margin-top:6px">Valentine Gauthier<br>Thomas Bernard</p></div>
<div class="r"><div class="cap">Contact</div><p style="margin-top:6px"><a href="mailto:contact@maisonsaintsauveur.fr">contact@maisonsaintsauveur.fr</a></p></div>
</footer>
</div>
</body>
</html>
