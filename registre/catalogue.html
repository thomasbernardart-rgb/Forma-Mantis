<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F3EF">
<title>Catalogue · Maison Saint Sauveur</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F4F3EF;color:#1B2124;font-family:Georgia,serif;text-align:center;font-size:18px}</style>
</head>
<body>
<p id="m">Ouverture du catalogue…</p>
<script src="lib/catalogue.js"></script>
<script>
(async () => {
  const URL_RPC = "https://imgpydatjmsxurjwpqpt.supabase.co/rest/v1/rpc/catalogue_public";
  const KEY = "sb_publishable_vabaOqZ5rWlS6lD7VbVwjQ_fgGehk6a";
  const m = document.getElementById("m");
  const j = (location.hash || "").slice(1) || new URLSearchParams(location.search).get("c") || "";
  const cle = "mss-catalogue-" + j;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  let cat = null;
  try {
    const r = await fetch(URL_RPC, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ j }) });
    if (!r.ok) throw new Error("http " + r.status);
    cat = await r.json();
    if (!cat) { try { localStorage.removeItem(cle); } catch (e) {} m.textContent = "Ce catalogue n'est plus disponible. · This catalogue is no longer available."; return; }
    try { localStorage.setItem(cle, JSON.stringify(cat)); } catch (e) {}
  } catch (e) {
    try { cat = JSON.parse(localStorage.getItem(cle) || "null"); } catch (x) {}
  }
  if (!cat) { m.textContent = "Catalogue introuvable. La première ouverture demande une connexion à Internet."; return; }
  if (cat.date && /^\d{4}-\d{2}-\d{2}$/.test(cat.date)) cat.date = new Date(cat.date + "T12:00:00").toLocaleDateString(cat.langue === "en" ? "en-GB" : "fr-FR", { day: "numeric", month: "long", year: "numeric" });
  document.open(); document.write(MSSCatalogue.html(cat)); document.close();
})();
</script>
</body>
</html>
